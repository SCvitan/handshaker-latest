events {}

http {
    server {
        listen 80;
        server_name croworker.app www.croworker.app;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name croworker.app www.croworker.app;

        client_max_body_size 10M;

        ssl_certificate /etc/letsencrypt/live/croworker.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/croworker.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # FRONTEND (must stay FIRST)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AUTH SERVICE (changed to /api/auth)
        location /api/auth/ {
            proxy_pass http://auth-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PROFILE SERVICE
        location /api/users/ {
            proxy_pass http://profiles-service:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # COMPANY SERVICE
        location /api/companies/ {
            proxy_pass http://company-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # optional
        location /verify {
            proxy_pass http://auth-service:8080/verify;
        }
    }
}